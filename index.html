<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GeoDuel — ugani državo</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#171717;--muted:#707070;--line:#dedbd2;--accent:#6757d9;--good:#2e9b62;--bad:#c75b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{font-size:27px;margin:0}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:#fff;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.center{text-align:center}.small{font-size:13px;color:var(--muted)}button,input{font:inherit}button{border:0;border-radius:13px;padding:12px 16px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;min-height:44px}button.secondary{background:#eeeae2;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}
input{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;min-height:44px;outline:none}input:focus{border-color:var(--accent)}
.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1;min-width:150px}
#map{width:100%;height:350px;background:#faf9f5;border-radius:17px;display:block}
.guessrow{display:flex;gap:8px;margin-top:12px}.guessrow input{flex:1}.guessrow button{flex:0 0 auto}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.suggest button{background:#f0eee9;color:#222;padding:8px 10px;font-size:13px;min-height:38px}
.result{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.result:first-child{border-top:0}.tag{font-size:12px;color:var(--muted)}.big{font-size:25px;font-weight:800}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}.player{border:1px solid var(--line);border-radius:15px;padding:12px}.player.active{border-color:var(--accent);box-shadow:0 0 0 2px #6757d922}
.hidden{display:none!important}.notice{padding:11px 13px;background:#f1efff;border-radius:13px;font-size:14px}.error{color:var(--bad)}
@media(max-width:520px){#map{height:285px}.top{align-items:flex-start}h1{font-size:23px}.result{grid-template-columns:1fr auto}.result .tag{grid-column:1/-1}}
</style>
</head>
<body>
<main>
  <div class="top"><h1>🌍 GeoDuel</h1><span class="pill" id="roomPill">ni sobe</span></div>

  <section id="lobby" class="card">
    <div class="center">
      <div class="big">Izzovi prijatelja</div>
      <p class="small">Ugibaj države po njihovi obliki. 6 poskusov. Kdor zadene z manj poskusi, zmaga.</p>
      <div class="actions">
        <button id="createBtn">Ustvari sobo</button>
        <button id="joinBtn" class="secondary">Pridruži se sobi</button>
      </div>
    </div>
    <div id="joinBox" class="hidden" style="margin-top:14px">
      <input id="roomInput" placeholder="Prilepi link sobe ali kodo">
      <button id="joinConfirm" style="margin-top:8px;width:100%">Pridruži se</button>
    </div>
  </section>

  <section id="waiting" class="card hidden center">
    <div class="big">Soba je pripravljena 🎉</div>
    <p class="small">Pošlji prijatelju ta link:</p>
    <input id="shareLink" readonly>
    <button id="copyBtn" style="margin-top:8px;width:100%">Kopiraj link</button>
    <p id="waitStatus" class="notice" style="margin-top:12px">Čakam na drugega igralca …</p>
  </section>

  <section id="game" class="hidden">
    <div class="players card">
      <div class="player" id="p1"><b>Ti</b><div class="small" id="p1s">0 poskusov</div></div>
      <div class="player" id="p2"><b>Prijatelj</b><div class="small" id="p2s">čaka …</div></div>
    </div>
    <div class="card">
      <div class="center"><div class="small">Katera država je to?</div><div id="round" class="big">1 / 6</div></div>
      <svg id="map" viewBox="0 0 700 380" aria-label="Obris skrivne države"></svg>
      <div class="guessrow">
        <input id="guess" autocomplete="off" placeholder="Vpiši državo …">
        <button id="guessBtn">Ugibaj</button>
      </div>
      <div id="suggest" class="suggest"></div>
      <div id="feedback" style="margin-top:10px"></div>
    </div>
    <div class="card"><b>Tvoja ugibanja</b><div id="history"></div></div>
  </section>

  <section id="end" class="card hidden center">
    <div class="big" id="endTitle">Konec!</div>
    <p id="answer"></p>
    <div id="score" class="notice"></div>
    <button id="again" style="margin-top:10px">Nova runda</button>
  </section>
</main>

<script>
const COUNTRIES_URL='https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';
const names = ["Afghanistan","Albania","Algeria","Andorra","Angola","Argentina","Armenia","Australia","Austria","Azerbaijan","Bahamas","Bahrain","Bangladesh","Barbados","Belarus","Belgium","Belize","Benin","Bhutan","Bolivia","Bosnia and Herzegovina","Botswana","Brazil","Brunei","Bulgaria","Burkina Faso","Burundi","Cambodia","Cameroon","Canada","Chad","Chile","China","Colombia","Congo","Costa Rica","Croatia","Cuba","Cyprus","Czechia","Denmark","Djibouti","Dominican Republic","Ecuador","Egypt","El Salvador","Estonia","Eswatini","Ethiopia","Fiji","Finland","France","Gabon","Gambia","Georgia","Germany","Ghana","Greece","Guatemala","Guinea","Guyana","Haiti","Honduras","Hungary","Iceland","India","Indonesia","Iran","Iraq","Ireland","Israel","Italy","Jamaica","Japan","Jordan","Kazakhstan","Kenya","Kuwait","Kyrgyzstan","Laos","Latvia","Lebanon","Lesotho","Liberia","Libya","Liechtenstein","Lithuania","Luxembourg","Madagascar","Malawi","Malaysia","Maldives","Mali","Malta","Mauritania","Mauritius","Mexico","Moldova","Monaco","Mongolia","Montenegro","Morocco","Mozambique","Myanmar","Namibia","Nepal","Netherlands","New Zealand","Nicaragua","Niger","Nigeria","North Korea","North Macedonia","Norway","Oman","Pakistan","Panama","Papua New Guinea","Paraguay","Peru","Philippines","Poland","Portugal","Qatar","Romania","Russia","Rwanda","Saudi Arabia","Senegal","Serbia","Singapore","Slovakia","Slovenia","Somalia","South Africa","South Korea","South Sudan","Spain","Sri Lanka","Sudan","Suriname","Sweden","Switzerland","Syria","Taiwan","Tajikistan","Tanzania","Thailand","Togo","Tunisia","Turkey","Turkmenistan","Uganda","Ukraine","United Arab Emirates","United Kingdom","United States of America","Uruguay","Uzbekistan","Venezuela","Vietnam","Yemen","Zambia","Zimbabwe"];

let peer=null, conn=null, isHost=false, roomId='', target=null, countries=[], byName=new Map(), guesses=[], connected=false;

const $=id=>document.getElementById(id);
function show(id){$(id).classList.remove('hidden')} function hide(id){$(id).classList.add('hidden')}
function randomId(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function roomUrl(id){return location.origin+location.pathname+'?room='+encodeURIComponent(id)}
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function setStatus(t){$('waitStatus').textContent=t}
function send(msg){if(conn&&conn.open) conn.send(msg)}

async function loadCountries(){
  if(countries.length)return;
  const data=await fetch(COUNTRIES_URL).then(r=>r.json());
  countries=topojson.feature(data,data.objects.countries).features;
  countries.forEach(f=>{if(f.properties?.name)byName.set(norm(f.properties.name),f)});
}
function pickTarget(){
  const valid=countries.filter(f=>f.properties?.name && f.properties.name.length>2);
  target=valid[Math.floor(Math.random()*valid.length)];
}
function drawTarget(){
  const svg=d3.select('#map'); svg.selectAll('*').remove();
  const w=700,h=380;
  const proj=d3.geoMercator().fitSize([w-50,h-50],target);
  const path=d3.geoPath(proj);
  svg.append('path').datum(target).attr('d',path).attr('transform','translate(25,25)')
    .attr('fill','#171717').attr('stroke','#171717').attr('stroke-width',1.2);
}
function centroid(f){return d3.geoCentroid(f)}
function hav(a,b){
 const r=6371, p=Math.PI/180, dLat=(b[1]-a[1])*p,dLon=(b[0]-a[0])*p;
 const x=Math.sin(dLat/2)**2+Math.cos(a[1]*p)*Math.cos(b[1]*p)*Math.sin(dLon/2)**2;
 return 2*r*Math.asin(Math.sqrt(x));
}
function bearing(a,b){
 const p=Math.PI/180,y1=a[1]*p,y2=b[1]*p,dl=(b[0]-a[0])*p;
 const y=Math.sin(dl)*Math.cos(y2),x=Math.cos(y1)*Math.sin(y2)-Math.sin(y1)*Math.cos(y2)*Math.cos(dl);
 return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function arrow(deg){return ['↑','↗','→','↘','↓','↙','←','↖'][Math.round(deg/45)%8]}
function proximity(km){return Math.max(0,Math.min(100,Math.round(100*Math.exp(-km/4500))))}

function submitGuess(){
 const raw=$('guess').value.trim(); if(!raw)return;
 const f=byName.get(norm(raw)) || countries.find(x=>norm(x.properties?.name||'')===norm(raw));
 if(!f){$('feedback').innerHTML='<span class="error">Ne najdem te države. Izberi predlog spodaj.</span>';return}
 if(guesses.some(g=>g.name===f.properties.name)){return}
 if(guesses.length>=6)return;
 const km=Math.round(hav(centroid(f),centroid(target))), deg=bearing(centroid(f),centroid(target));
 const hit=norm(f.properties.name)===norm(target.properties.name);
 const g={name:f.properties.name,km,dir:arrow(deg),pct:proximity(km),hit};
 guesses.push(g); renderHistory(); $('guess').value=''; $('suggest').innerHTML='';
 send({type:'guess',g,tries:guesses.length});
 if(hit){finish(true);return}
 if(guesses.length===6)finish(false);
}
function renderHistory(){
 $('history').innerHTML=guesses.map(g=>`<div class="result"><div><b>${g.name}</b><div class="tag">${g.hit?'🎯 pravilno':'razdalja do cilja'}</div></div><span>${g.km.toLocaleString('sl-SI')} km</span><b>${g.dir} ${g.pct}%</b></div>`).join('');
 $('round').textContent=(guesses.length+1)+' / 6';
 $('p1s').textContent=guesses.length+' poskusov';
}
function finish(won){
 $('answer').textContent='Država je bila: '+target.properties.name;
 $('score').textContent=won?`Zadel/a si v ${guesses.length}. poskusu.`:'Tokrat ni šlo — 6 poskusov je porabljenih.';
 hide('game');show('end');
 send({type:'finished',won,tries:guesses.length,answer:target.properties.name});
}
function startGame(){
 hide('lobby');hide('waiting');hide('end');show('game');guesses=[];renderHistory();drawTarget();
}
async function host(){
 await loadCountries(); isHost=true; roomId=randomId();
 peer=new Peer('geoduel-'+roomId);
 peer.on('open',id=>{
   $('roomPill').textContent='soba '+roomId; $('shareLink').value=roomUrl(roomId);
   hide('lobby');show('waiting'); setStatus('Čakam na prijatelja …');
 });
 peer.on('connection',c=>{
   if(conn)return;c.on('open',async()=>{conn=c;connected=true;setStatus('Prijatelj je tukaj! Začenjamo …');pickTarget();send({type:'start',name:target.properties.name});setTimeout(startGame,500)});
   c.on('data',onData);
 });
 peer.on('error',e=>setStatus('Napaka povezave: '+e.type));
}
async function join(value){
 await loadCountries(); const id=(value.includes('?room=')?new URL(value).searchParams.get('room'):value).trim().toUpperCase();
 if(!id)return;
 roomId=id; $('roomPill').textContent='soba '+roomId;
 peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('geoduel-'+roomId);conn.on('open',()=>{connected=true;hide('lobby');show('waiting');setStatus('Povezan/a. Čakam, da gostitelj začne …');send({type:'hello'})});conn.on('data',onData)});
 peer.on('error',e=>setStatus('Napaka povezave: '+e.type));
}
function onData(m){
 if(m.type==='start'){
   const f=byName.get(norm(m.name)); if(f){target=f;startGame()}
 } else if(m.type==='guess'){
   $('p2s').textContent=m.tries+' poskusov'; $('p2s').dataset.last=JSON.stringify(m.g);
 } else if(m.type==='finished'){
   $('p2s').textContent=m.tries+' poskusov'+(m.won?' 🎯':'');
   if(m.answer===target.properties.name){ $('endTitle').textContent=m.won?'Oba sta zadela!':'Runda končana'; }
 }
}
$('createBtn').addEventListener('click',host);
$('joinBtn').addEventListener('click',()=>show('joinBox'));
$('joinConfirm').addEventListener('click',()=>join($('roomInput').value));
$('guessBtn').addEventListener('click',submitGuess);
$('guess').addEventListener('keydown',e=>{if(e.key==='Enter')submitGuess()});
$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('shareLink').value);$('copyBtn').textContent='Kopirano ✓'}catch{ $('shareLink').select();document.execCommand('copy');$('copyBtn').textContent='Kopirano ✓'}});
$('again').addEventListener('click',()=>location.href=location.pathname);
$('guess').addEventListener('input',()=>{
 const q=norm($('guess').value); if(q.length<2){$('suggest').innerHTML='';return}
 const hits=names.filter(n=>norm(n).includes(q)).slice(0,7);
 $('suggest').innerHTML=hits.map(n=>`<button type="button">${n}</button>`).join('');
 $('suggest').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{$('guess').value=b.textContent;$('suggest').innerHTML=''}));
});
(async()=>{const q=new URLSearchParams(location.search).get('room');if(q){$('roomInput').value=q;show('joinBox')}})();
</script>
</body>
</html>
